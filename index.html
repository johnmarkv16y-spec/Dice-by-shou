<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Dice Game by SHOU</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    padding: 20px;
  }

  @keyframes gradientBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
  }

  h1 {
    font-size: 48px;
    color: #fff;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    margin-bottom: 40px;
  }

  /* Container for dice + creator text */
  .dice-container {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }

  /* Dice Box */
  #dice {
    width: 150px;
    height: 150px;
    font-size: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    user-select: none;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  #dice.roll {
    transform: rotate(20deg) scale(1.1);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }

  /* Created by text */
  .creator {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }

  /* Button */
  button {
    padding: 18px 45px;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: linear-gradient(45deg, #FF6B6B, #FFD93D);
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: #fff;
    top: 0;
    left: 50%;
    opacity: 0.8;
    border-radius: 50%;
    pointer-events: none;
    animation: fall 3s linear forwards;
  }

  @keyframes fall {
    0% {transform: translateY(0) rotate(0deg);}
    100% {transform: translateY(600px) rotate(720deg); opacity: 0;}
  }

  @media(max-width: 500px){
    #dice { width: 120px; height: 120px; font-size: 70px; }
    button { font-size: 18px; padding: 15px 30px; }
    .creator { font-size: 16px; }
  }
</style>
</head>
<body>

<h1>🎲 Ultimate Dice Game</h1>

<div class="dice-container">
  <div id="dice">🎲</div>
  <div class="creator">CREATED BY SHOU</div>
</div>

<button onclick="rollDice()">Roll Dice</button>

<audio id="rollSound">
  <source src="https://freesound.org/data/previews/522/522829_5121236-lq.mp3" type="audio/mpeg">
</audio>

<script>
  const diceDiv = document.getElementById("dice");
  const rollSound = document.getElementById("rollSound");

  const diceFaces = ["🎲","⚀","⚁","⚂","⚃","⚄","⚅"];

  function rollDice() {
    // Play sound
    rollSound.currentTime = 0;
    rollSound.play();

    // Add roll animation
    diceDiv.classList.add('roll');

    setTimeout(() => {
      diceDiv.classList.remove('roll');

      // Random dice number 1–6
      const dice = Math.floor(Math.random() * 6) + 1;
      diceDiv.textContent = diceFaces[dice];

      // Confetti if 6
      if(dice === 6) createConfetti(50);
    }, 300);
  }

  function createConfetti(count){
    for(let i=0; i<count; i++){
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random()*100 + '%';
      confetti.style.backgroundColor = `hsl(${Math.random()*360}, 80%, 60%)`;
      confetti.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(confetti);
      setTimeout(()=> confetti.remove(), 3000);
    }
  }
</script>

</body>
</html>
